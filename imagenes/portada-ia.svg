<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500" fill="none">
  <defs>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#acc5cb" opacity=".55"/>
    </pattern>
  </defs>
  <rect x="34" y="37" width="592" height="426" rx="40" fill="#edf4f3"/>
  <rect x="54" y="57" width="552" height="386" rx="30" fill="url(#puntos)"/>
  <circle cx="551" cy="100" r="45" fill="#dfebe6"/>
  <path d="M67 170c-22 40-22 93 0 131m510-2c22-40 22-93 0-131" stroke="#a5c4be" stroke-width="1.5" stroke-dasharray="4 7"/>

  <!-- Un editor de código sencillo muestra una propuesta que debe revisarse. -->
  <rect x="99" y="106" width="478" height="303" rx="18" fill="#173e50" opacity=".08"/>
  <rect x="89" y="96" width="478" height="303" rx="18" fill="#173e50"/>
  <path d="M89 143h478" stroke="#3b5b68"/>
  <circle cx="112" cy="120" r="4" fill="#e8c6a4"/>
  <circle cx="127" cy="120" r="4" fill="#b9d5b7"/>
  <circle cx="142" cy="120" r="4" fill="#94c9cb"/>
  <text x="332" y="124" text-anchor="middle" fill="#d4e1e5" font-family="Arial,sans-serif" font-size="12">una-idea.js</text>
  <g font-family="Consolas,monospace" font-size="14">
    <g fill="#88a6b1"><text x="112" y="181">01</text><text x="112" y="212">02</text><text x="112" y="243">03</text><text x="112" y="274">04</text><text x="112" y="305">05</text></g>
    <text x="151" y="181" fill="#9bc5b9">// Una tarea clara es el primer paso.</text>
    <text x="151" y="212" fill="#f5eee5"><tspan fill="#b9c7ec">function</tspan> validar(titulo) {</text>
    <text x="169" y="243" fill="#f5eee5"><tspan fill="#b9c7ec">return</tspan> typeof titulo === <tspan fill="#b8d6b7">'string'</tspan></text>
    <text x="187" y="274" fill="#f5eee5">&amp;&amp; titulo.trim().length &gt; <tspan fill="#e8c6a4">0</tspan>;</text>
    <text x="151" y="305" fill="#f5eee5">}</text>
  </g>
  <rect x="111" y="337" width="434" height="39" rx="9" fill="#294e5b"/>
  <circle cx="129" cy="356" r="5" fill="#b8d6b7"/>
  <text x="144" y="361" fill="#e2eeeb" font-family="Arial,sans-serif" font-size="12">Comprender → Proponer → Comprobar</text>

  <!-- La idea y la revisión enmarcan el trabajo con el asistente. -->
  <rect x="38" y="39" width="243" height="76" rx="16" fill="#ffffff" stroke="#d4e2de"/>
  <rect x="54" y="56" width="40" height="40" rx="12" fill="#f4eee3"/>
  <path d="M70 79c-9-6-4-17 4-17s13 11 4 17v5h-8v-5m1 9h6" stroke="#927046" stroke-width="1.7" stroke-linecap="round"/>
  <text x="107" y="69" fill="#526b70" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">TU PUNTO DE PARTIDA</text>
  <text x="107" y="92" fill="#173e50" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Una idea bien definida.</text>
  <rect x="352" y="383" width="262" height="78" rx="16" fill="#ffffff" stroke="#d4e2de"/>
  <circle cx="385" cy="421" r="18" fill="#e6f1e9"/>
  <path d="m377 421 6 6 11-12" stroke="#356e4c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="415" y="412" fill="#526b70" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">TU CRITERIO CUENTA</text>
  <text x="415" y="435" fill="#173e50" font-family="Arial,sans-serif" font-size="14" font-weight="bold">Revisar antes de integrar.</text>
  <path d="M584 231h24m-12-12v24M53 367h16m-8-8v16" stroke="#76a39b" stroke-width="2" stroke-linecap="round"/>
</svg>
